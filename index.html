<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fernwell – Houseplants & pots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#eef3ee;--surface:#fff;--ink:#14281f;--muted:#57695f;--line:#d3ddd5;--accent:#1f5e3f;--accent-ink:#fff;--pop:#e4572e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b15;--surface:#172720;--ink:#e8f1ea;--muted:#9bb0a3;--line:#2a3e34;--accent:#6fd09b;--accent-ink:#0f1b15;--pop:#ff7a52}}
:root[data-theme="dark"]{--bg:#0f1b15;--surface:#172720;--ink:#e8f1ea;--muted:#9bb0a3;--line:#2a3e34;--accent:#6fd09b;--accent-ink:#0f1b15;--pop:#ff7a52}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font:700 24px "Bricolage Grotesque",sans-serif}
.cartbtn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:9px 18px;font-weight:600}
.hero{padding:7vw 5vw 3vw;max-width:1100px;margin:auto}
.hero h1{font-size:clamp(40px,8vw,88px);max-width:12ch;letter-spacing:-.03em}
.hero p{max-width:46ch;color:var(--muted);font-size:18px;margin:16px 0 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:20px 5vw;max-width:1100px;margin:auto}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 16px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{max-width:1100px;margin:0 auto;padding:0 5vw 20px;color:var(--muted)}
.status:empty{display:none}
.status.err{color:var(--pop);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding:0 5vw 60px;max-width:1100px;margin:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card svg{width:100%;height:190px;display:block}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:20px}
.card small{color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
.price{font-weight:600;font-size:18px}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.overlay.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);z-index:10;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px))}
aside.on{transform:none}
.ahead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{background:none;border:0;color:var(--ink);font-size:28px;line-height:1}
#items{flex:1;overflow:auto}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink)}
.empty{color:var(--muted);padding:20px 0}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:600;padding:14px 0}
.checkout{width:100%;background:var(--pop);color:#fff;border:0;border-radius:10px;padding:14px;font-weight:600;font-size:17px}
.checkout:disabled{opacity:.4;cursor:not-allowed}
.done{text-align:center;padding:30px 0}
footer{padding:30px 5vw;text-align:center;color:var(--muted);border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">Fernwell</div>
  <button class="cartbtn" id="open" aria-label="Open cart">Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>Plants that live well indoors.</h1>
  <p>Hardy houseplants and handmade pots, shipped in two days with care instructions in the box.</p>
</section>

<div class="filters" id="filters" role="group" aria-label="Filter products"></div>
<p class="status" id="status" role="status" aria-live="polite"></p>
<main class="grid" id="grid" aria-busy="true"></main>
<footer>© 2026 Fernwell. Free shipping on orders over ₹1,500.</footer>

<div class="overlay" id="overlay"></div>
<aside id="cart" aria-label="Shopping cart" aria-hidden="true">
  <div class="ahead"><h2>Your cart</h2><button class="x" id="close" aria-label="Close cart">×</button></div>
  <div id="items"></div>
  <div class="total"><span>Total</span><span id="total">₹0</span></div>
  <button class="checkout" id="checkout">Place order</button>
</aside>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ===== REPLACE THESE TWO PLACEHOLDERS (publishable key only, never a secret/service-role key) ===== */
const SUPABASE_URL = "https://inmxkuwispmzkuirgupw.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1A8LdEReZy2ywsuTP5gZ2g_AGQnzuZ5";
/* ================================================================================================= */

const TABLE = "Ferns";
const fmt = n => "₹" + n.toLocaleString("en-IN");
const $ = id => document.getElementById(id);
const SVG_NS = "http://www.w3.org/2000/svg";

let products = [], loaded = false, cart = {}, filter = "All", loadSeq = 0, liveWarning = "";
try { cart = JSON.parse(localStorage.getItem("fw-cart") || "{}") || {} } catch (e) { cart = {} }

/* ---------- safe DOM helpers (database text only ever goes through textContent / setAttribute) ---------- */
function h(tag, opts = {}, ...kids) {
  const n = document.createElement(tag);
  if (opts.cls) n.className = opts.cls;
  if (opts.text != null) n.textContent = opts.text;
  for (const [k, v] of Object.entries(opts.attrs || {})) n.setAttribute(k, v);
  for (const [k, v] of Object.entries(opts.data || {})) n.dataset[k] = v;
  kids.forEach(k => n.appendChild(k));
  return n;
}
function svgEl(tag, attrs, parent) {
  const n = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
}
const safeColor = (c, fallback) => /^#[0-9a-f]{3,8}$/i.test(String(c || "")) ? c : fallback;

/* ---------- map a database row to what the page needs ---------- */
function normalize(row) {
  const price = Number(row.price);
  return {
    id: String(row.id),
    sortId: Number(row.id),
    name: String(row.name ?? row.title ?? "Untitled"),
    cat: String(row.category ?? row.cat ?? "Plants"),
    price: Number.isFinite(price) ? price : 0,
    pot: safeColor(row.pot_color ?? row.pot, "#8a9a8f"),
    leaf: row.leaf_color || row.leaf ? safeColor(row.leaf_color ?? row.leaf, "#2e7d4f") : "",
    note: String(row.note ?? row.description ?? "")
  };
}

function art(p) {
  const s = svgEl("svg", { viewBox: "0 0 200 190", role: "img", "aria-label": p.name });
  svgEl("rect", { width: 200, height: 190, fill: "var(--bg)" }, s);
  if (p.leaf) {
    [[-32, -22, -28], [0, -34, 0], [32, -22, 28]].forEach(([x, y, r]) => {
      svgEl("ellipse", { cx: 100 + x, cy: 100 + y, rx: 16, ry: 38, fill: p.leaf, transform: `rotate(${r} ${100 + x} ${100 + y + 20})` }, s);
    });
  } else if (p.cat === "Care") {
    svgEl("rect", { x: 88, y: 40, width: 24, height: 26, rx: 4, fill: p.pot, opacity: ".6" }, s);
  }
  if (p.cat === "Care") {
    svgEl("rect", { x: 74, y: 64, width: 52, height: 86, rx: 10, fill: p.pot }, s);
  } else {
    svgEl("path", { d: "M66 118h68l-8 42H74z", fill: p.pot }, s);
    svgEl("rect", { x: 62, y: 110, width: 76, height: 12, rx: 4, fill: p.pot }, s);
  }
  return s;
}

/* ---------- status line ---------- */
function setStatus(msg, isError = false) {
  const s = $("status");
  s.textContent = msg;
  s.classList.toggle("err", isError);
}

/* ---------- rendering ---------- */
function renderFilters() {
  const cats = ["All", ...new Set(products.map(p => p.cat))];
  if (!cats.includes(filter)) filter = "All";
  const box = $("filters");
  box.replaceChildren(...cats.map(c => h("button", { cls: "chip", text: c, attrs: { "aria-pressed": String(c === filter) }, data: { c } })));
}
function renderGrid() {
  const list = products.filter(p => filter === "All" || p.cat === filter);
  $("grid").replaceChildren(...list.map(p =>
    h("article", { cls: "card" },
      art(p),
      h("div", { cls: "body" },
        h("h3", { text: p.name }),
        h("small", { text: p.note }),
        h("div", { cls: "row" },
          h("span", { cls: "price", text: fmt(p.price) }),
          h("button", { cls: "add", text: "Add to cart", data: { id: p.id } }))))));
  $("grid").setAttribute("aria-busy", "false");
}
function save() { try { localStorage.setItem("fw-cart", JSON.stringify(cart)) } catch (e) {} }
function renderCart() {
  const lines = Object.keys(cart).filter(k => cart[k] > 0).map(id => ({ id, p: products.find(x => x.id === id), q: cart[id] })).filter(l => l.p);
  let total = 0, count = 0;
  const box = $("items");
  if (!lines.length) {
    box.replaceChildren(h("p", { cls: "empty", text: loaded || !Object.keys(cart).length ? "Your cart is empty. Add a plant to get started." : "Loading your cart…" }));
  } else {
    box.replaceChildren(...lines.map(({ id, p, q }) => {
      total += p.price * q; count += q;
      return h("div", { cls: "item" },
        h("strong", { text: p.name }),
        h("span", { text: fmt(p.price * q) }),
        h("div", { cls: "qty" },
          h("button", { text: "−", data: { d: "-1", id }, attrs: { "aria-label": "Remove one " + p.name } }),
          h("span", { text: String(q) }),
          h("button", { text: "+", data: { d: "1", id }, attrs: { "aria-label": "Add one " + p.name } })));
    }));
  }
  $("total").textContent = fmt(total);
  $("count").textContent = count;
  $("checkout").disabled = !lines.length;
}
function toggle(on) { $("cart").classList.toggle("on", on); $("overlay").classList.toggle("on", on); $("cart").setAttribute("aria-hidden", !on) }

/* ---------- Supabase ---------- */
let supabase = null;
try {
  if (SUPABASE_URL.startsWith("YOUR_") || SUPABASE_PUBLISHABLE_KEY.startsWith("YOUR_")) throw new Error("placeholders");
  supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
} catch (e) {
  setStatus("Supabase isn’t configured yet. Replace YOUR_SUPABASE_URL and YOUR_SUPABASE_PUBLISHABLE_KEY in the script.", true);
  $("grid").setAttribute("aria-busy", "false");
}

async function loadFerns() {
  if (!supabase) return;
  const seq = ++loadSeq;
  if (!loaded) setStatus("Loading plants…");
  const { data, error } = await supabase.from(TABLE).select("*");
  if (seq !== loadSeq) return; // a newer request is in flight; ignore this one
  if (error) {
    console.error("Could not load ferns:", error);
    const hint = error.code === "42501" || /permission|policy|row-level/i.test(error.message || "")
      ? " Check that Row Level Security allows public (anon) reads on this table."
      : "";
    setStatus(`Couldn’t load plants: ${error.message}.${hint}`, true);
    $("grid").setAttribute("aria-busy", "false");
    return;
  }
  products = data.map(normalize).sort((a, b) =>
    Number.isFinite(a.sortId) && Number.isFinite(b.sortId) ? a.sortId - b.sortId : a.name.localeCompare(b.name));
  loaded = true;
  setStatus(products.length ? liveWarning : "No plants available right now. Check back soon.", false);
  if (products.length && liveWarning) $("status").classList.add("err");
  renderFilters(); renderGrid();
  if (Object.keys(cart).length) renderCart();
}

/* ---------- events ---------- */
$("filters").onclick = e => { const c = e.target.dataset.c; if (c) { filter = c; renderFilters(); renderGrid() } };
$("grid").onclick = e => { const id = e.target.dataset.id; if (id) { cart[id] = (cart[id] || 0) + 1; save(); renderCart(); toggle(true) } };
$("items").onclick = e => { const id = e.target.dataset.id, d = +e.target.dataset.d; if (id && d) { cart[id] = Math.max(0, (cart[id] || 0) + d); if (!cart[id]) delete cart[id]; save(); renderCart() } };
$("open").onclick = () => toggle(true);
$("close").onclick = $("overlay").onclick = () => toggle(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") toggle(false) });
$("checkout").onclick = () => {
  const n = "FW-" + Math.floor(10000 + Math.random() * 90000);
  cart = {}; save(); renderCart();
  $("items").replaceChildren(h("div", { cls: "done" }, h("h2", { text: "Order placed" }), h("p", { text: `Your order number is ${n}. This is a demo, so no payment was taken.` })));
  $("checkout").disabled = true;
};

renderFilters(); renderCart();
await loadFerns();

if (supabase) {
  supabase
    .channel("ferns-page-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, () => loadFerns())
    .subscribe(status => {
      console.log("Realtime status:", status);
      if (status === "SUBSCRIBED") {
        liveWarning = "";
        if (loaded && products.length) setStatus("");
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
        liveWarning = "Live updates are unavailable, so changes may need a page refresh.";
        if (loaded && products.length) { setStatus(liveWarning, true) }
      }
    });
}
</script>
</body>
</html>
